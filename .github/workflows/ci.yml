name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # One transitive dependency (@reclaimprotocol/tls) is pinned to a git+ssh
      # URL in the lockfile. Rewrite it to HTTPS so npm can fetch it without keys.
      - name: Use HTTPS for git dependencies
        run: git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint
