name: Deploy CDK Stack

# Manual only. This workflow builds the Docker image and pushes it to ECR in
# whatever AWS account the OIDC role below lives in. It is kept as a reference
# deployment path; the project is not actively deployed anywhere.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish (e.g. latest or v1.2.3)"
        required: false
        default: "latest"

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: ./infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Uses GitHub OIDC instead of long-lived access keys. Create an IAM role
      # trusted by token.actions.githubusercontent.com for this repo and store
      # its ARN in the AWS_DEPLOY_ROLE_ARN repository variable.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Clean cdk.out (prevents old asset issues)
        working-directory: ./infra
        run: rm -rf cdk.out

      - name: CDK Diff
        working-directory: ./infra
        run: cdk diff

      - name: CDK Deploy
        working-directory: ./infra
        run: |
          TAG="${{ inputs.image_tag || 'latest' }}"
          echo "Deploying with image_tag=$TAG"
          cdk deploy --all --require-approval never --context image_tag=$TAG
