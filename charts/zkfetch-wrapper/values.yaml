# Default values for zkfetch-wrapper.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # Set this to the image URI produced by `cdk deploy` (see infra/) or your own registry.
  repository: "YOUR_REGISTRY/zkfetch-wrapper"
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8003

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/limit-rpm: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/client-max-body-size: "64m"
    ingress.kubernetes.io/proxy-connect-timeout: "120"
    ingress.kubernetes.io/proxy-send-timeout: "7200"
    ingress.kubernetes.io/proxy-read-timeout: "7200"
  hosts:
    - host: zkfetch.example.com
      paths: ["/"]
  tls:
    - secretName: zkfetch-wrapper-tls
      hosts:
        - zkfetch.example.com

resources:
  limits:
    cpu: "6"
    memory: 4Gi
  requests:
    cpu: "4"
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
