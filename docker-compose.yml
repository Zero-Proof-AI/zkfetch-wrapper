services:
  zkfetch-wrapper:
    build: .
    image: zkfetch-wrapper:local
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      PORT: "8003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped
